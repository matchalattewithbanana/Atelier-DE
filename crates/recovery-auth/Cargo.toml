[package]
name = "atelier-recovery-auth"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
pam = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }

[[bin]]
name = "atelier-recovery-auth-worker"
path = "src/main.rs"
required-features = ["pam"]
