[package]
name = "atelier-compositor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
native-seat = ["smithay/backend_session_libseat", "smithay/backend_udev", "dep:rustix"]

native-gbm = ["native-seat", "smithay/backend_gbm"]

native-kms = ["native-gbm", "smithay/backend_drm"]

native-input = ["native-seat", "smithay/backend_libinput"]

native-session = ["native-kms", "native-input", "dep:xcursor"]

[dependencies]
xcursor = { version = "0.3.10", optional = true }
rustix = { version = "1", features = ["fs", "event", "net"], optional = true }
atelier-config.workspace = true
anyhow.workspace = true
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "desktop", "wayland_frontend"] }
winit = "0.30"
tracing.workspace = true
tracing-subscriber.workspace = true
ctrlc = { version = "3.4", features = ["termination"] }

tempfile.workspace = true
