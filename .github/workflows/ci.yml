name: Native desktop checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dev libgtk-4-dev xvfb xauth libgl1-mesa-dri wayland-utils libseat-dev libudev-dev libinput-dev libgbm-dev libdrm-dev
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Check workspace
        run: cargo +stable check --workspace --all-targets
      - name: Test workspace
        run: cargo +stable test --workspace
      - name: Build nested session binaries
        run: cargo +stable build -p atelier-compositor -p atelier-session
      - name: Nested Wayland smoke
        run: xvfb-run -a bash scripts/nested-smoke.sh

      - name: Read-only hardware inventory
        run: target/debug/atelier-compositor --probe-hardware

      - name: Compile native-seat, native-gbm and native-kms features
        run: cargo +stable test -p atelier-compositor --features native-kms

      - name: Compile native-input feature
        run: cargo +stable test -p atelier-compositor --features native-input

      - name: Compile integrated native session
        run: cargo +stable test -p atelier-compositor --features native-session

      - name: Build GTK layer-shell dependency and panel
        run: |
          sudo apt-get install -y meson ninja-build wayland-protocols
          git clone --depth 1 --branch 1.0.4 https://github.com/wmww/gtk4-layer-shell.git "$RUNNER_TEMP/gtk4-layer-shell"
          meson setup "$RUNNER_TEMP/gtk4-layer-shell/build" "$RUNNER_TEMP/gtk4-layer-shell" --prefix "$RUNNER_TEMP/atelier-layer-shell" --libdir lib -Dintrospection=false -Dvapi=false -Ddocs=false -Dexamples=false -Dtests=false
          meson compile -C "$RUNNER_TEMP/gtk4-layer-shell/build"
          meson install -C "$RUNNER_TEMP/gtk4-layer-shell/build"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/atelier-layer-shell/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/atelier-layer-shell/lib:${LD_LIBRARY_PATH:-}"
          cargo +stable build -p atelier-shell --features layer-panel
          ATELIER_TEST_PANEL=1 xvfb-run -a bash scripts/nested-smoke.sh
